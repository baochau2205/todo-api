name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobs_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: create table in jobs_test_db
        run: psql -h localhost -U postgres -d jobs_test_db -f db/init.sql
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs-client/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run lint
      - run: npm run build